# 1 anchor, 5 aug anchor, 1 aitools, 1 other real, 3 vocoded, 3 aug vocoded - with RawBoost only, 1 other spoof, 1 aitools spoof
model:
  name: wav2vec2_vib_gelu
  flag_fix_ssl: false
  contra_mode: 'all' # 'one' or 'all'
  loss_type: 1 # 1: 2loss, 2: loss emb only, 3: loss final hidden state only
  recon_weight_l: 0.000001
  recon_weight_b: 0.05
  xlsr: 
    num_layers: 24
    order: 'first'
    custom_order: null
data:
  name: 'aiprocessed_augall_1_asvspoof'
  # name: 'eval_only'
  kwargs:
    vocoders: ['hifigan', 'hn-sinc-nsf-hifi', 'waveglow']
    augmentation_methods: ["RawBoost12", "background_noise_5_15", "reverb_1", "pitch_1", "volume_10"]
    aitools: ['SpeechTokenizer', 'voicefixer', 'BigCodec', 'denoiser']
    # aitools: ['voicefixer']
    num_aitools: 1 # Number of AI tools to use in bona fide samples
    num_additional_real: 1
    num_additional_spoof: 1 # should be same to num_aitools (for balance number of ai processed samples)
    trim_length: 64000
    wav_samp_rate: 16000
    online_aug: true
    aug_dir: '/datab/phucdt/tmp'
    noise_path: '/datab/Dataset/Noise/musan'
    rir_path: '/datab/Dataset/Noise//RIRS_NOISES'